name: ContentMind CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contentmind/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set test environment variables
        run: |
          echo "LLM_PROVIDER=heuristic" >> $GITHUB_ENV
          echo "HINDSIGHT_ALLOW_LOCAL_FALLBACK=true" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./test.db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV

      - name: Run backend tests
        run: |
          python -m pytest tests/ -q --tb=short

  frontend-checks:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contentmind/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: contentmind/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  backend-lint:
    name: Backend Lint (optional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contentmind/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff lint
        run: ruff check .

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contentmind/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set test environment variables
        run: |
          echo "LLM_PROVIDER=heuristic" >> $GITHUB_ENV
          echo "HINDSIGHT_ALLOW_LOCAL_FALLBACK=true" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./test_migration.db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci-only" >> $GITHUB_ENV

      - name: Run Alembic migration
        run: |
          alembic upgrade head

      - name: Verify migration
        run: |
          python -c "
          from app.database import engine
          from app.models import Base
          from sqlalchemy import inspect
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          print(f'Tables found: {len(tables)}')
          for t in tables:
              print(f'  {t}')
          # Verify alembic_version table exists
          assert 'alembic_version' in tables
          print('Migration test passed!')
          "

  # Deploy job - only runs on main branch after all checks pass
  deploy-staging:
    name: Deploy to Staging
    needs: [backend-tests, frontend-checks, migration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment..."
          # Add your deployment commands here
          # Example: docker build, push to registry, deploy to Kubernetes/ECS/etc.

  deploy-production:
    name: Deploy to Production
    needs: [backend-tests, frontend-checks, migration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploy to production environment..."
          # Add your production deployment commands here
          # Requires manual approval in GitHub Environments